name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:18-3.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: uae_food_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      valkey:
        image: valkey/valkey:8-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Detect workspace
        id: detect
        run: |
          if [ -f package.json ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi

      - uses: pnpm/action-setup@v4
        if: steps.detect.outputs.present == 'true'
        with:
          version: 12

      - uses: actions/setup-node@v4
        if: steps.detect.outputs.present == 'true'
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        if: steps.detect.outputs.present == 'true'
        run: pnpm install --frozen-lockfile

      - name: Lint and typecheck
        if: steps.detect.outputs.present == 'true'
        run: pnpm turbo lint typecheck

      - name: Test
        if: steps.detect.outputs.present == 'true'
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5433/uae_food_test
          DATABASE_TEST_URL: postgresql://postgres:postgres@localhost:5433/uae_food_test
          REDIS_URL: redis://localhost:6380
          JWT_SECRET: ci-only-secret-min-32-characters-long
          NODE_ENV: test
          PAYMENT_ADAPTER: mock
        run: pnpm turbo test
